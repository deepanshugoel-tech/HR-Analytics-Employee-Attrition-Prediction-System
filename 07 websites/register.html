<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HR Analytics | Register</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            👤
        </div>

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            AI-Powered HR Analytics System
        </p>

        <form id="registerForm">

            <label for="registerName">
                Full Name
            </label>

            <input
                type="text"
                id="registerName"
                placeholder="Enter your full name"
                required
            >

            <label for="registerEmail">
                Email
            </label>

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                required
            >

            <label for="registerPassword">
                Password
            </label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Create password"
                minlength="6"
                required
            >

            <label for="registerRole">
                Select Role
            </label>

            <select id="registerRole" required>

                <option value="">
                    Select Role
                </option>

                <option value="HR">
                    HR
                </option>

                <option value="Employee">
                    Employee
                </option>

            </select>

            <button
                type="submit"
                class="auth-btn"
            >
                Create Account
            </button>

        </form>

        <p
            id="registerMessage"
            class="auth-message"
        ></p>

        <p class="auth-switch">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>

<script>

document
    .getElementById("registerForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const name = document
            .getElementById("registerName")
            .value
            .trim();

        const email = document
            .getElementById("registerEmail")
            .value
            .trim()
            .toLowerCase();

        const password = document
            .getElementById("registerPassword")
            .value;

        const role = document
            .getElementById("registerRole")
            .value;

        const message =
            document.getElementById("registerMessage");

        // Get existing users
        let users = JSON.parse(
            localStorage.getItem("hrUsers") || "[]"
        );

        // Check whether account already exists
        const existingUser = users.find(function(user) {

            return (
                user.email.trim().toLowerCase() === email
            );

        });

        if (existingUser) {

            message.textContent =
                "❌ This email is already registered. Please login.";

            message.className =
                "auth-message error";

            return;
        }

        // Create new account
        const newUser = {

            id: Date.now(),

            name: name,

            email: email,

            password: password,

            role: role

        };

        // Add user without deleting old accounts
        users.push(newUser);

        // Permanently save users in browser
        localStorage.setItem(
            "hrUsers",
            JSON.stringify(users)
        );

        message.textContent =
            "✅ Account created successfully! Redirecting to login...";

        message.className =
            "auth-message success";

        // Go to login
        setTimeout(function() {

            window.location.href = "login.html";

        }, 1000);

    });

</script>

</body>
</html>
